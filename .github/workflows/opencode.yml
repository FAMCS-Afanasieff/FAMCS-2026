name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  push:
    branches: [main, feat/cleanup]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy shellcheck
          pip install --user ruff

      - name: Lint C++ (compile check)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -o /dev/null verify.cpp
          g++ -std=c++17 -Wall -Wextra -Werror -o /dev/null overlap.cpp
          g++ -std=c++17 -Wall -Wextra -Werror -o /dev/null p3_brute.cpp
          g++ -std=c++17 -Wall -Wextra -Werror -o /dev/null p3_construct.cpp

      - name: Lint Python
        run: ruff check stress.py

      - name: Lint shell scripts
        run: shellcheck run_examples.sh

  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle